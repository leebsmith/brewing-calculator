<!-- Grain Bill Editor Modal (Major Contributors) -->
<div
  x-show="$store.maltGrid.modalOpen"
  x-transition.opacity.duration.200ms
  class="modal-backdrop"
  style="display: none;"
  @keydown.escape.window="$store.maltGrid.cancelModal()"
>
  <div class="modal-dialog modal-dialog-workspace">
    <!-- Modal Header -->
    <div class="modal-workspace-header">
      <div class="modal-workspace-header-title">
        <h2 class="modal-workspace-title">Grain Bill Editor (Major Contributors)</h2>
        <span
          class="status-badge text-xs"
          :class="$store.maltGrid.validationStatus.class"
          x-text="$store.maltGrid.validationStatus.label"
        ></span>
      </div>
      <div class="modal-workspace-header-actions">
        <button
          type="button"
          @click="$store.maltGrid.cancelModal()"
          class="btn btn-secondary text-xs"
        >
          Cancel
        </button>
        <button
          type="button"
          @click="$store.maltGrid.saveModal()"
          class="btn btn-primary text-xs"
          :disabled="$store.maltGrid.validationStatus.type !== 'balanced'"
        >
          Save &amp; Apply
        </button>
      </div>
    </div>

    <!-- Modal Body (2-Zone Spatial Layout) -->
    <div class="modal-workspace-body">
      <!-- Left/Center: Main Grid Workspace -->
      <div class="modal-workspace-main">
        <div class="table-header-toolbar">
          <span class="table-header-meta">
            Enter relative proportional parts. Hamilton algorithm normalizes total to exactly 100.0%.
          </span>
          <button
            type="button"
            @click="$store.maltGrid.openSearchDrawer()"
            class="btn btn-primary text-xs"
          >
            <span>+ Add Malt from Catalog</span>
          </button>
        </div>

        <!-- Fixed-Layout Data Grid (7 Columns) -->
        <div class="data-table-container">
          <table class="data-table is-fixed">
            <colgroup>
              <col style="width: 24%;" />
              <col style="width: 12%;" />
              <col style="width: 11%;" />
              <col style="width: 11%;" />
              <col style="width: 12%;" />
              <col style="width: 10%;" />
              <col style="width: 10%;" />
              <col style="width: 10%;" />
            </colgroup>
            <thead>
              <tr>
                <th>Malt Name</th>
                <th>Category</th>
                <th class="text-right" x-text="$store.maltGrid.weightedColorUnit"></th>
                <th class="text-right" x-text="$store.maltGrid.weightedPotentialUnit"></th>
                <th class="text-right">
                  <span>Weighted</span><br />
                  <span x-text="$store.maltGrid.weightedContributionUnit"></span>
                </th>
                <th class="text-right">Parts</th>
                <th class="text-right">Malt %</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in $store.maltGrid.draftMajorMalts" :key="row.row_id">
                <tr>
                  <td>
                    <span class="font-sans font-medium text-primary truncate" x-text="row.name"></span>
                    <template x-if="row.is_custom">
                      <span class="status-badge status-badge-info text-nano">Custom</span>
                    </template>
                  </td>
                  <td class="font-sans text-secondary text-micro truncate" x-text="row.category"></td>
                  <td class="text-right tabular-nums text-secondary" x-text="$store.maltGrid.maltColorDisplay(row)"></td>
                  <td class="text-right tabular-nums text-secondary" x-text="$store.maltGrid.maltPotentialDisplay(row)"></td>
                  <td class="text-right tabular-nums text-secondary" x-text="$store.maltGrid.maltWeightedContributionDisplay(row)"></td>
                  <td class="text-right">
                    <input
                      type="number"
                      step="0.1"
                      min="0"
                      :value="row.parts"
                      @input="$store.maltGrid.updateParts(row.row_id, $event.target.value)"
                      class="form-input table-input-parts"
                    />
                  </td>
                  <td class="align-right">
                    <div class="table-pct-cell">
                      <span
                        class="table-pct-value"
                        :class="{ 'is-trace': $store.maltGrid.isTrace(row.pct) }"
                        x-text="row.pct.toFixed(1) + '%'"
                      ></span>
                      <template x-if="$store.maltGrid.isTrace(row.pct)">
                        <span class="table-pct-badge is-trace" title="Trace addition (&lt;2%)">
                          <span>✗</span>
                          <span>Trace</span>
                        </span>
                      </template>
                      <template x-if="!$store.maltGrid.isTrace(row.pct)">
                        <span class="table-pct-badge is-valid">
                          <span>✓</span>
                        </span>
                      </template>
                    </div>
                  </td>
                  <td class="align-right">
                    <div class="table-action-cell">
                      <button
                        type="button"
                        @click="$store.maltGrid.cloneAndEdit(row.row_id)"
                        class="btn-action-icon"
                        title="Clone & Edit"
                      >
                        <span>📋</span>
                      </button>
                      <button
                        type="button"
                        @click="$store.maltGrid.removeMajorMalt(row.row_id)"
                        class="btn-action-icon btn-action-danger"
                        title="Remove Malt"
                      >
                        <span>🗑</span>
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <template x-if="$store.maltGrid.draftMajorMalts.length === 0">
                <tr>
                  <td colspan="8" class="table-empty-cell">
                    No malts in grain bill draft. Click '+ Add Malt from Catalog' to begin.
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr class="table-summary-row">
                <td colspan="2" class="font-sans font-bold text-primary">Totals</td>
                <td class="text-right tabular-nums font-bold" x-text="$store.maltGrid.weightedColorDisplay"></td>
                <td class="text-right tabular-nums font-bold" x-text="$store.maltGrid.weightedPotentialDisplay"></td>
                <td class="text-right tabular-nums font-bold" x-text="$store.maltGrid.totalWeightedContributionDisplay"></td>
                <td class="text-right tabular-nums font-bold" x-text="$store.maltGrid.totalParts.toFixed(1)"></td>
                <td class="text-right tabular-nums font-bold" x-text="$store.maltGrid.totalPct.toFixed(1) + '%'"></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <!-- Slide-Over Drawer Scrim -->
      <div
        x-show="$store.maltGrid.drawerMode !== null"
        x-transition.opacity.duration.200ms
        class="modal-drawer-scrim"
        style="display: none;"
        @click="$store.maltGrid.closeDrawer()"
      ></div>

      <!-- Right: Contextual Slide-Out Utility Drawer -->
      <div
        x-show="$store.maltGrid.drawerMode !== null"
        x-transition:enter="drawer-slide-enter"
        x-transition:enter-start="drawer-slide-hidden"
        x-transition:enter-end="drawer-slide-visible"
        x-transition:leave="drawer-slide-leave"
        x-transition:leave-start="drawer-slide-visible"
        x-transition:leave-end="drawer-slide-hidden"
        class="modal-workspace-drawer"
        style="display: none;"
        @keydown.escape.window="$store.maltGrid.closeDrawer()"
      >
        <!-- Drawer Header -->
        <div class="modal-drawer-header">
          <h3
            class="modal-drawer-title"
            x-text="$store.maltGrid.drawerMode === 'search' ? 'Malt Catalog Browser' : 'Row Inspector'"
          ></h3>
          <button
            type="button"
            class="btn-close text-xs"
            @click="$store.maltGrid.closeDrawer()"
          >
            ✕
          </button>
        </div>

        <!-- Drawer Body -->
        <div class="modal-drawer-body">
          <!-- Search / Catalog Mode -->
          <template x-if="$store.maltGrid.drawerMode === 'search'">
            <div class="catalog-drawer-list">
              <span class="table-header-meta">
                Select a malt from the catalog cache to add to your grist.
              </span>

              <!-- Real-time Full-Text Search Input -->
              <div class="catalog-search-wrapper" style="margin-top: var(--space-3); margin-bottom: var(--space-2);">
                <input
                  type="text"
                  x-model.debounce.50ms="$store.maltGrid.catalogSearchQuery"
                  placeholder="Search malts by name or notes..."
                  class="form-input text-xs"
                  style="padding-right: var(--space-8);"
                />
                <button
                  type="button"
                  x-show="$store.maltGrid.catalogSearchQuery"
                  @click="$store.maltGrid.clearSearchQuery()"
                  class="catalog-search-clear"
                  title="Clear search"
                >
                  ✕
                </button>
              </div>

              <!-- Category Screening Toggle Pills -->
              <div class="filter-pills-container">
                <button
                  type="button"
                  class="filter-pill"
                  :class="{ 'is-active': $store.maltGrid.isCategorySelected('BASE') }"
                  :aria-pressed="$store.maltGrid.isCategorySelected('BASE').toString()"
                  @click="$store.maltGrid.toggleCategory('BASE')"
                >
                  Base
                </button>
                <button
                  type="button"
                  class="filter-pill"
                  :class="{ 'is-active': $store.maltGrid.isCategorySelected('CRYSTAL') }"
                  :aria-pressed="$store.maltGrid.isCategorySelected('CRYSTAL').toString()"
                  @click="$store.maltGrid.toggleCategory('CRYSTAL')"
                >
                  Crystal
                </button>
                <button
                  type="button"
                  class="filter-pill"
                  :class="{ 'is-active': $store.maltGrid.isCategorySelected('ROASTED') }"
                  :aria-pressed="$store.maltGrid.isCategorySelected('ROASTED').toString()"
                  @click="$store.maltGrid.toggleCategory('ROASTED')"
                >
                  Roasted
                </button>
                <button
                  type="button"
                  class="filter-pill"
                  :class="{ 'is-active': $store.maltGrid.isCategorySelected('ACID') }"
                  :aria-pressed="$store.maltGrid.isCategorySelected('ACID').toString()"
                  @click="$store.maltGrid.toggleCategory('ACID')"
                >
                  Acid
                </button>
              </div>

              <!-- Live Result Counter -->
              <div
                class="catalog-result-counter text-xs"
                aria-live="polite"
                x-text="`Showing ${$store.maltGrid.catalogResultCount} available malts`"
              ></div>

              <div class="catalog-drawer-list">
                <template x-for="item in $store.maltGrid.filteredCatalog" :key="item.id">
                  <div class="catalog-item-card">
                    <div>
                      <div class="catalog-item-name" x-text="item.name"></div>
                      <div
                        class="catalog-item-meta"
                        x-text="item.category + ' • Lovibond: ' + item.color_lovibond + (item.notes ? ' • ' + item.notes : '')"
                      ></div>
                    </div>
                    <button
                      type="button"
                      @click="$store.maltGrid.addMajorMalt(item); $store.maltGrid.closeDrawer();"
                      class="btn btn-primary text-xs"
                    >
                      + Add
                    </button>
                  </div>
                </template>
                <template x-if="!$store.catalog.loaded">
                  <div class="table-empty-cell">Loading malt catalog...</div>
                </template>
                <template x-if="$store.catalog.loaded && $store.maltGrid.filteredCatalog.length === 0">
                  <div class="table-empty-cell">
                    No matching malts found. Adjust search query or category filters.
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Row Inspector Mode -->
          <template x-if="$store.maltGrid.drawerMode === 'inspect'">
            <div class="inspector-form">
              <template x-if="$store.maltGrid.draftMajorMalts.find(r => r.row_id === $store.maltGrid.activeRowId)">
                <div
                  class="inspector-form"
                  x-data="{ row: $store.maltGrid.draftMajorMalts.find(r => r.row_id === $store.maltGrid.activeRowId) }"
                >
                  <div class="form-group">
                    <label class="form-label text-xs">Malt Name</label>
                    <input type="text" x-model="row.name" class="form-input text-xs" />
                  </div>
                  <div class="form-group">
                    <label class="form-label text-xs">Category</label>
                    <select x-model="row.category" class="form-select text-xs">
                      <option value="BASE">BASE</option>
                      <option value="CRYSTAL">CRYSTAL</option>
                      <option value="ROASTED">ROASTED</option>
                      <option value="SPECIALTY">SPECIALTY</option>
                      <option value="ADJUNCT">ADJUNCT</option>
                    </select>
                  </div>
                  <div class="inspector-grid-2col">
                    <div class="form-group">
                      <label class="form-label text-xs">Extract Yield (%)</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0.5"
                        max="1.0"
                        class="form-input text-xs font-mono"
                        x-model.number="row.potential_fraction"
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label text-xs">Color (Lovibond)</label>
                      <input
                        type="number"
                        step="0.1"
                        min="0"
                        class="form-input text-xs font-mono"
                        x-model.number="row.color_lovibond"
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label text-xs">Moisture (%)</label>
                      <input
                        type="number"
                        step="0.005"
                        min="0"
                        max="0.2"
                        class="form-input text-xs font-mono"
                        x-model.number="row.moisture_pct"
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label text-xs">Distilled pH</label>
                      <input
                        type="number"
                        step="0.01"
                        min="4.0"
                        max="7.0"
                        class="form-input text-xs font-mono"
                        x-model.number="row.di_ph"
                      />
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="form-label text-xs">Notes / Supplier Info</label>
                    <textarea x-model="row.notes" class="form-input text-xs" rows="3"></textarea>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>
