<!-- Step 5: Batch Sparge Solver (POST /api/solve-batch) -->
<div class="step-card" :class="{ 'is-active': activeStep === 5, 'is-completed': completedSteps.includes(5) }">
    <div class="accordion-header">
        <button
                type="button"
                class="accordion-trigger"
                :aria-expanded="(activeStep === 5).toString()"
                aria-controls="step-panel-5"
                id="step-trigger-5"
                @click="setActiveStep(5)"
        >
            <div class="accordion-title-wrap">
                <span class="accordion-step-num">5</span>
                <div>
                    <span class="accordion-title">Batch Sparge Solver</span>
                    <span class="accordion-subtitle">Grist mass, pre-boil volume &amp; stage cascade</span>
                </div>
            </div>
            <div class="accordion-controls">
                <span class="accordion-status-pill" :class="getStepStatusClass(5)" x-text="getStepStatusLabel(5)"></span>
                <span class="accordion-chevron" x-text="activeStep === 5 ? '▲' : '▼'"></span>
            </div>
        </button>
    </div>

    <div
            id="step-panel-5"
            role="region"
            aria-labelledby="step-trigger-5"
            x-cloak
            x-show="activeStep === 5"
            x-collapse
            class="step-card-body"
    >
        <div class="step-card-content">
            <!-- Constraint Topology & Intensive Value -->
            <div class="step-grid-2col">
                <div class="form-group">
                    <label class="form-label">
                        <span>Constraint Topology</span>
                    </label>
                    <select class="form-select text-sm" x-model="batchSolverTopology">
                        <option value="r_l_to_g">{V_pre_boil, R_L:G} — fixed mash thickness</option>
                        <option value="runoff_ratio">{V_pre_boil, r} — equal-runnings optimized</option>
                    </select>
                    <span class="form-hint">Selects which intensive constraint the root-finder consumes.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span x-text="batchSolverTopology === 'r_l_to_g' ? 'Liquor-to-Grist Ratio (L/kg)' : 'Runoff Ratio r (dimensionless)'"></span>
                    </label>
                    <input
                            type="number"
                            step="0.1"
                            min="0.1"
                            class="form-input tabular-nums"
                            x-model.number="batchSolverIntensiveValue"
                    />
                    <span class="form-hint" x-text="batchSolverTopology === 'r_l_to_g' ? 'Strike water per kg of grist.' : 'V_run2 / V_run1; 1.0 is equal runnings.'"></span>
                </div>
            </div>

            <!-- Solve Trigger -->
            <div class="step-actions" style="justify-content: flex-start; margin-top: var(--space-4);">
                <button
                        type="button"
                        class="btn btn-primary"
                        @click="solveBatch()"
                        :disabled="batchSolverLoading"
                >
                    <span x-text="batchSolverLoading ? 'Solving…' : 'Solve Batch'"></span>
                </button>
            </div>

            <!-- Error Surface (log-only per spec; shown inline for dev visibility) -->
            <template x-if="batchSolverError">
                <div class="status-badge status-badge-danger text-xs" style="margin-top: var(--space-3);" x-text="batchSolverError"></div>
            </template>

            <!-- Results -->
            <template x-if="batchSolverResult">
                <div style="margin-top: var(--space-4);">
                    <h3 class="modal-drawer-title">Derived Anchors</h3>
                    <div class="data-table-container">
                        <table class="data-table">
                            <tbody>
                            <tr>
                                <td>Post-Boil Gravity (SG)</td>
                                <td class="text-right tabular-nums font-bold" x-text="batchSolverResult.sg_post_boil.toFixed(4)"></td>
                            </tr>
                            <tr>
                                <td>Pre-Boil Volume (L)</td>
                                <td class="text-right tabular-nums font-bold" x-text="batchSolverResult.v_pre_boil.toFixed(2)"></td>
                            </tr>
                            <tr>
                                <td>Post-Boil Extract Target (kg)</td>
                                <td class="text-right tabular-nums font-bold" x-text="batchSolverResult.s_post_boil_target.toFixed(4)"></td>
                            </tr>
                            <tr>
                                <td>Grist Mass (kg)</td>
                                <td class="text-right tabular-nums font-bold" x-text="batchSolverResult.m_grist.toFixed(3)"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <h3 class="modal-drawer-title" style="margin-top: var(--space-4);">Stage Cascade</h3>
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                            <tr>
                                <th>Stage</th>
                                <th class="text-right">Volume (L)</th>
                                <th class="text-right">Extract (kg)</th>
                                <th class="text-right">Gravity (SG)</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>Strike</td>
                                <td class="text-right tabular-nums" x-text="batchSolverResult.cascade.v_strike.toFixed(2)"></td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>First Runnings</td>
                                <td class="text-right tabular-nums" x-text="batchSolverResult.cascade.v_run1.toFixed(2)"></td>
                                <td class="text-right tabular-nums" x-text="batchSolverResult.cascade.s_run1.toFixed(4)"></td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>Second Runnings</td>
                                <td class="text-right tabular-nums" x-text="batchSolverResult.cascade.v_run2.toFixed(2)"></td>
                                <td class="text-right tabular-nums" x-text="batchSolverResult.cascade.s_run2.toFixed(4)"></td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>Sparge</td>
                                <td class="text-right tabular-nums" x-text="batchSolverResult.cascade.v_sparge.toFixed(2)"></td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>Pre-Boil (consolidated)</td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums font-bold" x-text="batchSolverResult.cascade.sg_pre_boil.toFixed(4)"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </div>

        <!-- Step Action Button -->
        <div class="step-actions">
            <button
                    type="button"
                    @click="markStepComplete(5)"
                    class="btn btn-primary"
            >
                Finish
            </button>
        </div>
    </div>
</div>
