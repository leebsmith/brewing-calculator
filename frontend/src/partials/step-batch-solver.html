<!-- Step 5: Batch Sparge Solver (POST /api/solve-batch) -->
<div class="step-card" :class="{ 'is-active': activeStep === 5, 'is-completed': completedSteps.includes(5) }">
    <div class="accordion-header">
        <button
                type="button"
                class="accordion-trigger"
                :aria-expanded="(activeStep === 5).toString()"
                aria-controls="step-panel-5"
                id="step-trigger-5"
                @click="setActiveStep(5)"
        >
            <div class="accordion-title-wrap">
                <span class="accordion-step-num">5</span>
                <div>
                    <span class="accordion-title">Batch Sparge Solver</span>
                    <span class="accordion-subtitle">Grist mass, pre-boil volume &amp; stage cascade</span>
                </div>
            </div>
            <div class="accordion-controls">
                <span class="accordion-status-pill" :class="getStepStatusClass(5)" x-text="getStepStatusLabel(5)"></span>
                <span class="accordion-chevron" x-text="activeStep === 5 ? '▲' : '▼'"></span>
            </div>
        </button>
    </div>

    <div
            id="step-panel-5"
            role="region"
            aria-labelledby="step-trigger-5"
            x-cloak
            x-show="activeStep === 5"
            x-collapse
            class="step-card-body"
    >
        <div class="step-card-content">
            <!-- Target Endpoint Inputs (unified-treatment.md §3) -->
            <div class="step-grid-2col">
                <div class="form-group">
                    <label class="form-label">
                        <span>Target Fermenter Volume (V_ferm)</span>
                        <button
                            type="button"
                            @click="$store.units.toggle('step5_v_ferm')"
                            class="unit-badge"
                            :class="{ 'unit-badge-customized': $store.units.isCustomized('step5_v_ferm') }"
                            x-text="$store.units.getLabel('step5_v_ferm')"
                            title="Click to toggle unit"
                        ></button>
                    </label>
                    <input
                            type="number"
                            step="0.5"
                            min="0.1"
                            class="form-input tabular-nums"
                            :value="volDisplay(manifest.v_ferm, 'step5_v_ferm')"
                            @input="setVolDisplay(manifest, 'v_ferm', $event.target.value, 'step5_v_ferm'); markBatchSolverStale()"
                    />
                    <span class="form-hint">Cold packaged volume into the fermenter. The solver reverses kettle losses and boil-off to derive V_pre_boil.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span>Target ABV (%)</span>
                    </label>
                    <input
                            type="number"
                            step="0.1"
                            min="0.1"
                            :max="batchSolverResult ? batchSolverResult.max_achievable_abv.toFixed(1) : 20"
                            class="form-input tabular-nums"
                            x-model.number="manifest.target_abv"
                            @input="markBatchSolverStale()"
                    />
                    <span class="form-hint">
                        Always expressed as a percentage (no unit toggle). Consumed by Phase 1.
                        <template x-if="batchSolverResult">
                            <span> Max at current attenuation: <span x-text="batchSolverResult.max_achievable_abv.toFixed(1)"></span>%.</span>
                        </template>
                    </span>
                </div>
            </div>

            <!-- Constraint Topology & Intensive Value -->
            <div class="step-grid-2col">
                <div class="form-group">
                    <label class="form-label">
                        <span>Constraint Topology</span>
                    </label>
                    <select class="form-select text-sm" x-model="batchSolverTopology" @change="onTopologyChange()">
                        <option value="r_l_to_g">{V_pre_boil, R_L:G} — fixed mash thickness</option>
                        <option value="runoff_ratio">{V_pre_boil, r} — equal-runnings optimized</option>
                    </select>
                    <span class="form-hint">Selects which intensive constraint the root-finder consumes.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <span x-text="batchSolverTopology === 'r_l_to_g' ? 'Liquor-to-Grist Ratio' : 'Runoff Ratio r'"></span>
                        <button
                            type="button"
                            x-show="batchSolverTopology === 'r_l_to_g'"
                            @click="$store.units.toggle('step5_intensive_value')"
                            class="unit-badge"
                            :class="{ 'unit-badge-customized': $store.units.isCustomized('step5_intensive_value') }"
                            x-text="$store.units.getLabel('step5_intensive_value')"
                            title="Click to toggle unit"
                        ></button>
                        <span
                            x-show="batchSolverTopology !== 'r_l_to_g'"
                            class="text-xs text-muted"
                            x-text="'(dimensionless)'"
                        ></span>
                    </label>
                    <input
                            type="number"
                            step="0.1"
                            min="0.1"
                            class="form-input tabular-nums"
                            :value="intensiveValueDisplay()"
                            @input="setIntensiveValueDisplay($event.target.value)"
                    />
                    <span class="form-hint" x-text="batchSolverTopology === 'r_l_to_g' ? ('Strike water per ' + intensiveValueMassUnit + ' of grist.') : 'V_run1 / V_run2; 1.0 is equal runnings.'"></span>
                </div>
            </div>

            <!-- HLT Starting Volume (batch-level; see plans/vessel-loss-model.md §5.1) -->
            <div class="step-grid-2col">
                <div class="form-group">
                    <label class="form-label">
                        <span>HLT Starting Volume</span>
                        <button
                            type="button"
                            @click="$store.units.toggle('step5_hlt_starting_volume_l')"
                            class="unit-badge"
                            :class="{ 'unit-badge-customized': $store.units.isCustomized('step5_hlt_starting_volume_l') }"
                            x-text="$store.units.getLabel('step5_hlt_starting_volume_l')"
                            title="Click to toggle unit"
                        ></button>
                    </label>
                    <input
                            type="number"
                            step="0.5"
                            min="0"
                            :max="manifest.equipment ? manifest.equipment.max_hlt_volume_l : null"
                            class="form-input tabular-nums"
                            :value="volDisplay(manifest.hlt_starting_volume_l, 'step5_hlt_starting_volume_l')"
                            @input="setVolDisplay(manifest, 'hlt_starting_volume_l', $event.target.value, 'step5_hlt_starting_volume_l'); markBatchSolverStale()"
                    />
                </div>
            </div>

            <!-- Solve Trigger -->
            <div class="step-actions" style="justify-content: flex-start; margin-top: var(--space-4);">
                <button
                        type="button"
                        class="btn btn-primary"
                        @click="solveBatch()"
                        :disabled="batchSolverLoading"
                >
                    <span x-text="batchSolverLoading ? 'Solving…' : 'Solve Batch'"></span>
                </button>
            </div>

            <!-- Error Surface (log-only per spec; shown inline for dev visibility) -->
            <template x-if="batchSolverError">
                <div class="status-badge status-badge-danger text-xs" style="margin-top: var(--space-3);" x-text="batchSolverError"></div>
            </template>

            <!-- Results -->
            <template x-if="batchSolverResult">
                <div style="margin-top: var(--space-4);">
                    <h3 class="modal-drawer-title">Derived Anchors</h3>
                    <div class="data-table-container">
                        <table class="data-table">
                            <tbody>
                            <tr>
                                <td>Post-Boil Gravity</td>
                                <td class="text-right tabular-nums font-bold" x-text="gravityDisplay(batchSolverResult.sg_post_boil, 'step5_sg_post_boil') + ' ' + $store.units.getLabel('step5_sg_post_boil')"></td>
                            </tr>
                            <tr>
                                <td>Pre-Boil Volume</td>
                                <td class="text-right tabular-nums font-bold" x-text="volDisplay(batchSolverResult.v_pre_boil, 'step5_v_pre_boil') + ' ' + $store.units.getLabel('step5_v_pre_boil')"></td>
                            </tr>
                            <tr>
                                <td>Post-Boil Extract Target</td>
                                <td class="text-right tabular-nums font-bold" x-text="massDisplay(batchSolverResult.s_post_boil_target, 'step5_s_post_boil_target') + ' ' + $store.units.getLabel('step5_s_post_boil_target')"></td>
                            </tr>
                            <tr>
                                <td>Grist Mass</td>
                                <td class="text-right tabular-nums font-bold" x-text="massDisplay(batchSolverResult.m_grist, 'step5_m_grist') + ' ' + $store.units.getLabel('step5_m_grist')"></td>
                            </tr>
                            <tr>
                                <td>Post-Boil Volume</td>
                                <td class="text-right tabular-nums font-bold" x-text="volDisplay(batchSolverResult.cascade.v_post_boil, 'step5_v_post_boil') + ' ' + $store.units.getLabel('step5_v_post_boil')"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <h3 class="modal-drawer-title" style="margin-top: var(--space-4);">Stage Cascade</h3>
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                            <tr>
                                <th>Stage</th>
                                <th class="text-right">Volume</th>
                                <th class="text-right">Extract</th>
                                <th class="text-right">Gravity</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>Strike</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.cascade.v_strike, 'step5_v_strike') + ' ' + $store.units.getLabel('step5_v_strike')"></td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>First Runnings</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.cascade.v_run1, 'step5_v_run1') + ' ' + $store.units.getLabel('step5_v_run1')"></td>
                                <td class="text-right tabular-nums" x-text="massDisplay(batchSolverResult.cascade.s_run1, 'step5_s_run1') + ' ' + $store.units.getLabel('step5_s_run1')"></td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>Second Runnings</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.cascade.v_run2, 'step5_v_run2') + ' ' + $store.units.getLabel('step5_v_run2')"></td>
                                <td class="text-right tabular-nums" x-text="massDisplay(batchSolverResult.cascade.s_run2, 'step5_s_run2') + ' ' + $store.units.getLabel('step5_s_run2')"></td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>Sparge</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.cascade.v_sparge, 'step5_v_sparge') + ' ' + $store.units.getLabel('step5_v_sparge')"></td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums">—</td>
                            </tr>
                            <tr>
                                <td>Pre-Boil (consolidated)</td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums">—</td>
                                <td class="text-right tabular-nums font-bold" x-text="gravityDisplay(batchSolverResult.cascade.sg_pre_boil, 'step5_sg_pre_boil') + ' ' + $store.units.getLabel('step5_sg_pre_boil')"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <h3 class="modal-drawer-title" style="margin-top: var(--space-4);">Water Plan</h3>
                    <div class="data-table-container">
                        <table class="data-table">
                            <tbody>
                            <tr>
                                <td>Strike Volume</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.cascade.v_strike, 'step5_v_strike') + ' ' + $store.units.getLabel('step5_v_strike')"></td>
                            </tr>
                            <tr>
                                <td>Sparge Demand</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.cascade.v_sparge, 'step5_v_sparge') + ' ' + $store.units.getLabel('step5_v_sparge')"></td>
                            </tr>
                            <tr>
                                <td>HLT Top-Up</td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.hlt.v_hlt_top_up, 'step5_v_hlt_top_up') + ' ' + $store.units.getLabel('step5_v_hlt_top_up')"></td>
                            </tr>
                            <tr>
                                <td>
                                    <span>Sparge Deliverable</span>
                                    <template x-if="hasSurplusSpargeCapacity">
                                        <span class="text-xs text-muted" x-text="' (surplus sparge capacity: ' + surplusSpargeCapacityDisplay + ' ' + $store.units.getLabel('step5_v_sparge') + ')'"></span>
                                    </template>
                                </td>
                                <td class="text-right tabular-nums" x-text="volDisplay(batchSolverResult.hlt.v_sparge_deliverable, 'step5_v_sparge_deliverable') + ' ' + $store.units.getLabel('step5_v_sparge_deliverable')"></td>
                            </tr>
                            <tr>
                                <td>
                                    <span>Sparge Salt Dosing Volume</span>
                                    <span class="text-xs text-muted"> (V_sparge_salted = V_hlt_after_strike + V_hlt_top_up)</span>
                                </td>
                                <td class="text-right tabular-nums" x-text="spargeSaltedVolumeDisplay + ' ' + $store.units.getLabel('step5_v_sparge_deliverable')"></td>
                            </tr>
                            <tr>
                                <td class="font-bold">Total Water Used</td>
                                <td class="text-right tabular-nums font-bold" x-text="totalWaterUsedDisplay + ' ' + $store.units.getLabel('step5_v_sparge')"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </div>

        <!-- Step Action Button -->
        <div class="step-actions">
            <button
                    type="button"
                    @click="markStepComplete(5)"
                    class="btn btn-primary"
                    :disabled="!batchSolverResult || batchSolverStale"
                    :title="!batchSolverResult ? 'Solve the batch before finishing.' : (batchSolverStale ? 'Inputs changed since the last solve. Solve again to finish.' : '')"
            >
                Finish
            </button>
        </div>
    </div>
</div>
