<!-- Step Batch Metadata Accordion Card (in partials) -->
<div class="step-card" :class="{ 'is-active': activeStep === 2, 'is-completed': completedSteps.includes(2) }">
    <div class="accordion-header">
        <button
                type="button"
                class="accordion-trigger"
                :aria-expanded="activeStep === 2"
                aria-controls="step-panel-2"
                id="step-trigger-2"
                @click="setActiveStep(2)"
        >
            <div class="accordion-title-wrap">
                <span class="accordion-step-num">2</span>
                <div>
                    <span class="accordion-title">Batch Metadata &amp; Targets</span>
                    <span class="accordion-subtitle">Recipe name, target volume, original gravity &amp; boil duration</span>
                </div>
            </div>
            <div class="accordion-controls">
                <span class="accordion-status-pill" :class="getStepStatusClass(2)" x-text="getStepStatusLabel(2)"></span>
                <span class="accordion-chevron" x-text="activeStep === 2 ? '▲' : '▼'"></span>
            </div>
        </button>
    </div>

    <div
            id="step-panel-2"
            role="region"
            aria-labelledby="step-trigger-2"
            x-show="activeStep === 2"
            x-collapse
            class="step-card-body"
    >
        <!-- Batch Metadata & Boil Solver -->
        <div class="step-card-content">
            <!-- Batch Name -->
            <div class="form-group">
                <label class="form-label">Batch Name</label>
                <input type="text" x-model="manifest.name" @input="onBatchMetaChange" class="form-input" placeholder="e.g. West Coast IPA 2026" required />
                <span class="form-hint">Unique identifier for this brewing recipe</span>
            </div>

            <!-- Generalized 2-DOF Solver: 6-Pill Output Selector -->
            <div class="form-group">
                <div class="solver-mode-header">
                    <label class="form-label">Boil Solver Outputs</label>
                    <span
                        class="solver-mode-hint"
                        x-text="solverOutputs.length === 2
                            ? 'Solving: ' + solverOutputs.join(' + ')
                            : 'Select 2 variables to solve for'"
                    ></span>
                </div>
                <div class="solver-pill-toolbar">
                    <template x-for="v in solverVariables" :key="v.key">
                        <button
                            type="button"
                            class="solver-pill"
                            :class="{
                                'is-selected': isSolverOutput(v.key),
                                'is-disabled': isSolverPillDisabled(v.key)
                            }"
                            :disabled="isSolverPillDisabled(v.key)"
                            :title="solverPillDisabledReason(v.key)"
                            :aria-pressed="isSolverOutput(v.key).toString()"
                            @click="toggleSolverPill(v.key)"
                        >
                            <span class="solver-pill-key" x-text="v.key"></span>
                            <span class="solver-pill-label" x-text="v.label"></span>
                        </button>
                    </template>
                </div>
                <template x-if="solverError">
                    <span class="form-hint text-danger" x-text="solverError"></span>
                </template>
            </div>

            <div class="step-grid-2col">
                <!-- Pre-Boil Volume -->
                <div class="form-group">
                    <label class="form-label">
                        <span>Pre-Boil Volume</span>
                        <button type="button" @click="$store.units.toggle('step2_preboil_volume_l')" class="unit-badge" :class="{ 'unit-badge-customized': $store.units.isCustomized('step2_preboil_volume_l') }" x-text="$store.units.getLabel('step2_preboil_volume_l')" title="Click to toggle unit"></button>
                    </label>
                    <input
                        type="number"
                        step="0.5"
                        min="1"
                        :value="volDisplay(manifest.preboil_volume_l, 'step2_preboil_volume_l')"
                        @input="setVolDisplay(manifest, 'preboil_volume_l', $event.target.value, 'step2_preboil_volume_l')"
                        class="form-input tabular-nums"
                        :class="{ 'form-input-solved': isSolverOutput('V1') }"
                        :readonly="isSolverOutput('V1')"
                        required
                    />
                    <span class="form-hint" x-text="isSolverOutput('V1') ? '⚙️ Solved' : 'Total wort collected in kettle prior to boil'"></span>
                </div>

                <!-- Pre-Boil Gravity -->
                <div class="form-group">
                    <label class="form-label">
                        <span>Pre-Boil Gravity</span>
                        <button type="button" @click="$store.units.toggle('step2_preboil_gravity')" class="unit-badge" :class="{ 'unit-badge-customized': $store.units.isCustomized('step2_preboil_gravity') }" x-text="$store.units.getLabel('step2_preboil_gravity')" title="Click to toggle gravity unit"></button>
                    </label>
                    <input
                        type="number"
                        step="0.001"
                        min="1.000"
                        max="1.200"
                        :value="gravityDisplay(manifest.preboil_gravity, 'step2_preboil_gravity')"
                        @input="setGravityDisplay(manifest, 'preboil_gravity', $event.target.value, 'step2_preboil_gravity')"
                        class="form-input tabular-nums"
                        :class="{ 'form-input-solved': isSolverOutput('G1') }"
                        :readonly="isSolverOutput('G1')"
                        required
                    />
                    <span class="form-hint" x-text="isSolverOutput('G1') ? '⚙️ Solved' : 'Specific gravity or Plato measured before boil'"></span>
                </div>

                <!-- Post-Boil Volume -->
                <div class="form-group">
                    <label class="form-label">
                        <span>Post-Boil Volume</span>
                        <button type="button" @click="$store.units.toggle('step2_postboil_volume_l')" class="unit-badge" :class="{ 'unit-badge-customized': $store.units.isCustomized('step2_postboil_volume_l') }" x-text="$store.units.getLabel('step2_postboil_volume_l')" title="Click to toggle unit"></button>
                    </label>
                    <input
                        type="number"
                        step="0.5"
                        min="1"
                        :value="volDisplay(manifest.postboil_volume_l, 'step2_postboil_volume_l')"
                        @input="setVolDisplay(manifest, 'postboil_volume_l', $event.target.value, 'step2_postboil_volume_l')"
                        class="form-input tabular-nums"
                        :class="{ 'form-input-solved': isSolverOutput('V2') }"
                        :readonly="isSolverOutput('V2')"
                        required
                    />
                    <span class="form-hint" x-text="isSolverOutput('V2') ? '⚙️ Solved' : 'Hot wort volume at flameout'"></span>
                </div>

                <!-- Post-Boil Gravity -->
                <div class="form-group">
                    <label class="form-label">
                        <span>Post-Boil Gravity</span>
                        <button type="button" @click="$store.units.toggle('step2_postboil_gravity')" class="unit-badge" :class="{ 'unit-badge-customized': $store.units.isCustomized('step2_postboil_gravity') }" x-text="$store.units.getLabel('step2_postboil_gravity')" title="Click to toggle gravity unit"></button>
                    </label>
                    <input
                        type="number"
                        step="0.001"
                        min="1.000"
                        max="1.200"
                        :value="gravityDisplay(manifest.postboil_gravity, 'step2_postboil_gravity')"
                        @input="setGravityDisplay(manifest, 'postboil_gravity', $event.target.value, 'step2_postboil_gravity')"
                        class="form-input tabular-nums"
                        :class="{ 'form-input-solved': isSolverOutput('G2') }"
                        :readonly="isSolverOutput('G2')"
                        required
                    />
                    <span class="form-hint" x-text="isSolverOutput('G2') ? '⚙️ Solved' : 'Specific gravity or Plato measured after boil'"></span>
                </div>

                <!-- Boil Time -->
                <div class="form-group">
                    <label class="form-label">Boil Time (min)</label>
                    <input
                        type="number"
                        step="5"
                        min="0"
                        max="180"
                        x-model.number="manifest.boil_time_min"
                        @input="onBatchMetaChange"
                        class="form-input tabular-nums"
                        :class="{ 'form-input-solved': isSolverOutput('t') }"
                        :readonly="isSolverOutput('t')"
                        required
                    />
                    <span class="form-hint" x-text="isSolverOutput('t') ? '⚙️ Solved' : 'Duration of wort boil'"></span>
                </div>

                <!-- Boil-Off Rate -->
                <div class="form-group">
                    <label class="form-label">
                        <span>Boil-Off Rate</span>
                        <button type="button" @click="$store.units.toggle('step1_boil_off_rate_l_per_hr')" class="unit-badge" :class="{ 'unit-badge-customized': $store.units.isCustomized('step1_boil_off_rate_l_per_hr') }" x-text="$store.units.getLabel('step1_boil_off_rate_l_per_hr') + '/hr'" title="Click to toggle unit"></button>
                    </label>
                    <input
                        type="number"
                        step="0.1"
                        min="0.1"
                        max="15"
                        :value="volDisplay(manifest.equipment.boil_off_rate_l_per_hr, 'step1_boil_off_rate_l_per_hr')"
                        @input="setVolDisplay(manifest.equipment, 'boil_off_rate_l_per_hr', $event.target.value, 'step1_boil_off_rate_l_per_hr')"
                        class="form-input tabular-nums"
                        :class="{ 'form-input-solved': isSolverOutput('R_boil') }"
                        :readonly="isSolverOutput('R_boil')"
                        required
                    />
                    <span class="form-hint" x-text="isSolverOutput('R_boil') ? '⚙️ Solved' : 'Evaporation rate per hour (PID duty cycle)'"></span>
                </div>

                <!-- Target Packaged Volume (Result) -->
                <div class="form-group">
                    <label class="form-label">
                        <span>Target Packaged Volume</span>
                        <button type="button" @click="$store.units.toggle('step2_target_volume_l')" class="unit-badge" :class="{ 'unit-badge-customized': $store.units.isCustomized('step2_target_volume_l') }" x-text="$store.units.getLabel('step2_target_volume_l')" title="Click to toggle unit"></button>
                    </label>
                    <input type="number" step="0.5" min="1" :value="volDisplay(manifest.target_volume_l, 'step2_target_volume_l')" readonly disabled class="form-input tabular-nums" />
                    <span class="form-hint">Derived: Post-boil × (1 − shrinkage) − trub loss − kettle dead space</span>
                </div>
            </div>
        </div>

        <!-- Synthesized Output Summary Card -->
        <div class="synthesized-card">
            <div class="synthesized-header">
                <span class="synthesized-title">Synthesized Target Kettle Extract (S<sub>kettle</sub>)</span>
                <span class="status-badge status-badge-success text-xs">Mass Balance Validated</span>
            </div>
            <div class="metric-strip">
                <div class="metric-cell">
                    <span class="metric-cell-label">Pre-Boil Vol / SG</span>
                    <span class="metric-cell-val" x-text="volDisplay(manifest.preboil_volume_l, 'step2_preboil_volume_l') + ' ' + $store.units.getLabel('step2_preboil_volume_l') + ' (' + gravityDisplay(manifest.preboil_gravity, 'step2_preboil_gravity') + ' ' + $store.units.getLabel('step2_preboil_gravity') + ')'"></span>
                </div>
                <div class="metric-cell">
                    <span class="metric-cell-label">Post-Boil Vol / OG</span>
                    <span class="metric-cell-val" x-text="volDisplay(manifest.postboil_volume_l, 'step2_postboil_volume_l') + ' ' + $store.units.getLabel('step2_postboil_volume_l') + ' (' + gravityDisplay(manifest.postboil_gravity, 'step2_postboil_gravity') + ' ' + $store.units.getLabel('step2_postboil_gravity') + ')'"></span>
                </div>
                <div class="metric-cell">
                    <span class="metric-cell-label">Target Packaged Vol</span>
                    <span class="metric-cell-val" x-text="volDisplay(manifest.target_volume_l, 'step2_target_volume_l') + ' ' + $store.units.getLabel('step2_target_volume_l')"></span>
                </div>
                <div class="metric-cell">
                    <span class="metric-cell-label">Target Total Extract</span>
                    <span class="metric-cell-val" x-text="targetKettleExtractDisplay + ' ' + targetKettleExtractUnit"></span>
                </div>
            </div>
        </div>

        <!-- Step Action Button -->
        <div class="step-actions">
            <button
                    type="button"
                    @click="markStepComplete(2)"
                    class="btn btn-primary"
            >
                Next: Grain Bill →
            </button>
        </div>
    </div>
</div>
