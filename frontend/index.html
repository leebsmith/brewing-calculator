<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Brewing Calculator</title>

  <!-- Prevent FOUC with Alpine x-cloak -->
  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <!-- Design System Tokens & Modular Vanilla Stylesheets -->
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase Web SDK (Compat libraries for CDN delivery) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <!-- Application logic and constants loaded as native Vite ES modules -->
  <script type="module" src="/script.js"></script>
</head>
<body class="app-shell" x-data>
  <!-- Site Header -->
  <load src="./src/partials/site-header.html" />

  <!-- Main Content Container: Alpine.data Component -->
  <main class="main-content" x-data="app">
    <div class="content-stack">
      <!-- Auth Status Banner / Guest State Gate -->
      <div
        x-cloak
        x-show="!$store.auth.loading && !$store.auth.user"
        class="card card-hero"
      >
        <h2 class="card-title">Batch Brewing Calculator</h2>
        <p class="card-description">
          Please sign in with Google using the button in the top navigation bar to authenticate and access the secure brewing calculation engine and ingredient catalog.
        </p>
      </div>

      <div
        x-cloak
        x-show="!$store.auth.loading && $store.auth.user"
        class="wizard-stack"
        x-data="wizard"
      >
        <!-- Test Minimum Working Example Include -->
        <load src="./src/partials/hello.html" />

        <!-- Ingredient Catalog Status Card -->
        <load src="./src/partials/ingredient-status-card.html" />

        <!-- Step 1: Equipment Profile Accordion Card -->
        <load src="./src/partials/step-equipment-profile.html" />

        <!-- Step 3: Yeast Selection -->
        <load src="./src/partials/step-yeast-selection.html" />

        <!-- Step 4: Fermentables (Grain Bill & Hamilton Proportional Allocator) -->
        <load src="./src/partials/step-fermentables.html" />

        <!-- Step 5: Mash Profile -->
        <load src="./src/partials/step-mash-profile.html" />

        <!-- Step 6: Batch Sparge Solver (POST /api/solve-batch) -->
        <load src="./src/partials/step-batch-solver.html" />

        <div
          x-show="showProfileDrawer"
          x-transition.opacity.duration.200ms
          class="drawer-backdrop"
          style="display: none;"
          @keydown.escape.window="closeProfileDrawer()"
        >
          <div class="drawer-panel" @click.outside="closeProfileDrawer()">
            <div class="drawer-header">
              <h2
                class="drawer-title"
                x-text="drawerMode === 'list' ? 'Equipment Profile Library' : (drawerMode === 'create' ? 'Create Custom Profile' : 'Edit Profile')"
              ></h2>
              <button type="button" class="btn-close" @click="closeProfileDrawer()">✕</button>
            </div>

            <div class="drawer-body">
              <template x-if="drawerError">
                <div class="panel-error text-xs" x-text="drawerError"></div>
              </template>

              <!-- List Mode -->
              <template x-if="drawerMode === 'list'">
                <div class="profile-drawer-list-view">
                  <div class="table-header-toolbar">
                    <span class="text-xs text-muted">
                      Select preset or create custom hardware profile.
                    </span>
                    <button
                      type="button"
                      class="btn btn-primary text-xs"
                      @click="startCreateProfile()"
                    >
                      + New Profile
                    </button>
                  </div>
                  <div class="profile-roster">
                    <template x-for="p in $store.equipment.profiles" :key="p.id">
                      <div class="profile-card-item" :class="{ 'is-selected': manifest.equipment_profile_id === p.id }">
                        <div>
                          <div class="profile-card-header">
                            <span x-text="p.name"></span>
                            <template x-if="p.is_custom">
                              <span class="status-badge status-badge-info text-nano">Custom</span>
                            </template>
                          </div>
                          <div class="profile-card-meta" x-text="p.description || 'No description'"></div>
                        </div>
                        <div class="profile-card-actions">
                          <button
                            type="button"
                            class="btn btn-secondary text-xs"
                            @click="selectProfile(p.id); closeProfileDrawer();"
                          >
                            Load
                          </button>
                          <template x-if="p.is_custom">
                            <div class="profile-card-custom-actions">
                              <button
                                type="button"
                                class="btn btn-secondary text-xs"
                                @click="editProfile(p)"
                              >
                                Edit
                              </button>
                              <button
                                type="button"
                                class="btn btn-danger-outline text-xs"
                                @click="removeCustomProfile(p.id)"
                              >
                                Delete
                              </button>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Create / Edit Form Mode -->
              <template x-if="drawerMode === 'create' || drawerMode === 'edit'">
                <form @submit.prevent="submitDrawerProfile()" class="profile-drawer-form">
                  <div class="form-group">
                    <label class="form-label">Profile Identifier (Slug)</label>
                    <input
                      type="text"
                      class="form-input"
                      x-model="drawerForm.id"
                      :disabled="drawerMode === 'edit'"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Profile Name</label>
                    <input
                      type="text"
                      class="form-input"
                      x-model="drawerForm.name"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea
                      class="form-input"
                      x-model="drawerForm.description"
                      rows="2"
                    ></textarea>
                  </div>
                  <div class="step-grid-2col">
                    <div class="form-group">
                      <label class="form-label">Max Kettle (L)</label>
                      <input
                        type="number"
                        step="0.5"
                        class="form-input"
                        x-model.number="drawerForm.max_kettle_volume_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Max Mash Tun (L)</label>
                      <input
                        type="number"
                        step="0.5"
                        class="form-input"
                        x-model.number="drawerForm.max_mash_tun_volume_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Max HLT (L)</label>
                      <input
                        type="number"
                        step="0.5"
                        class="form-input"
                        x-model.number="drawerForm.max_hlt_volume_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">HLT Coil Floor (L)</label>
                      <input
                        type="number"
                        step="0.5"
                        class="form-input"
                        x-model.number="drawerForm.hlt_coil_floor_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">HLT Starting Volume (L)</label>
                      <input
                        type="number"
                        step="0.5"
                        class="form-input"
                        x-model.number="drawerForm.hlt_starting_volume_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Mash Tun Dead Space (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.mash_dead_space_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Mash Tun Transfer Loss (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.mash_transfer_loss_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Boil Kettle Dead Space (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.kettle_dead_space_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Boil Kettle Transfer Loss (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.kettle_transfer_loss_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">HLT Dead Space (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.hlt_dead_space_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">HLT Transfer Loss (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.hlt_transfer_loss_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Trub Loss (L)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.trub_loss_l"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Boil-Off (L/hr)</label>
                      <input
                        type="number"
                        step="0.1"
                        class="form-input"
                        x-model.number="drawerForm.boil_off_rate_l_per_hr"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Grain Absorption (L/kg)</label>
                      <input
                        type="number"
                        step="0.01"
                        class="form-input"
                        x-model.number="drawerForm.grain_absorption_factor_l_per_kg"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Conversion Efficiency (Ce)</label>
                      <input
                        type="number"
                        step="0.01"
                        class="form-input"
                        x-model.number="drawerForm.conversion_efficiency"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Shrinkage (%)</label>
                      <input
                        type="number"
                        step="0.005"
                        class="form-input"
                        x-model.number="drawerForm.shrinkage_pct"
                        required
                      />
                    </div>
                  </div>

                  <div class="drawer-footer-actions">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      @click="drawerMode = 'list'"
                    >
                      Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                  </div>
                </form>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Toast Notification Container -->
  <load src="src/partials/toast-container.html" />

  <!-- Site Footer -->
  <load src="src/partials/site-footer.html" />
</body>
</html>
